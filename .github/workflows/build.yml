name: Validate and build CVs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-lang-french
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: dist/*.pdf
          retention-days: 30
