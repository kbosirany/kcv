name: Publish CVs to the portfolio

# CVs whose brief contains "portfolio: <name>.pdf" are copied to kbosirany/kportfolio
# (public/cv/) through a pull request.
# Prerequisite: secret PORTFOLIO_TOKEN = token scoped to the kportfolio repository
# (Contents: read/write, Pull requests: read/write). Without the secret the job stops cleanly.

on:
  push:
    branches: [main]
    paths: ["people/**", "templates/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
    steps:
      - name: Check the secret
        id: secret
        run: |
          if [ -z "$PORTFOLIO_TOKEN" ]; then
            echo "PORTFOLIO_TOKEN missing: nothing to publish."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secret.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.secret.outputs.ok == 'true'
        run: |
          pip install -r requirements.txt
          python scripts/validate.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-lang-french
          python scripts/build.py
      - if: steps.secret.outputs.ok == 'true'
        name: Open a PR on kportfolio
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pdfs=(dist/portfolio/*.pdf)
          [ ${#pdfs[@]} -gt 0 ] || { echo "No CV flagged for the portfolio."; exit 0; }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/kbosirany/kportfolio.git" portfolio
          cd portfolio
          git checkout -B maj-cv
          mkdir -p public/cv
          cp ../dist/portfolio/*.pdf public/cv/
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Portfolio PDFs are already up to date."; exit 0
          fi
          git config user.name "kcv-bot"
          git config user.email "kcv-bot@users.noreply.github.com"
          git add public/cv
          git commit -m "CV: update from kcv (${GITHUB_SHA::7})"
          git push --force origin maj-cv
          gh pr create --repo kbosirany/kportfolio --head maj-cv --base main \
            --title "Update CVs from kcv" \
            --body "PDFs regenerated by kcv at commit ${GITHUB_SHA}. Also update \"maj\" in data/cv.yml if needed." \
            || gh pr edit maj-cv --repo kbosirany/kportfolio --body "PDFs regenerated by kcv at commit ${GITHUB_SHA}."
