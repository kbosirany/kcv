name: Build CVs and deploy site

on:
  push:
    branches: [main]
    paths:
      - 'cv/**/*.tex'
      - 'cv/**/*.bib'
      - 'site/**'

# Optionnel : permettre aussi un déclenchement manuel
#  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended biber

      - name: Build main CV
        run: |
          cd cv/main
          pdflatex -interaction=nonstopmode cv-main.tex
          biber cv-main
          pdflatex -interaction=nonstopmode cv-main.tex
          mkdir -p ../../site/cv
          cp cv-main.pdf ../../site/cv/cv-main.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
